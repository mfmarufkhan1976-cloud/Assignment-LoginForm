<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background: linear-gradient(90deg, skyblue , purple);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form{
            height: 80%;
            width: 30%;
            background-color: white;
            border-radius: 10px;

        }
        .Email,.Password,.login{
            /* border: 1px solid black; */
            width: 80%;
            height: 20%;
            margin: auto;
            margin-top: 3%;
        }
        h1{
            margin-top: 5%;
            height: 10%;
        
        }
        input{
            margin-top: 5%;
            height: 50%;
            width: 100%;
            text-align: center;
        }
    p{
        margin-top: 5%;
    }
    #Login{
    background: linear-gradient(90deg, skyblue , purple);
    border-radius: 10px;
    }
    .Password>p{
        
        font-style: italic;
    }
    .login.p{
        text-align: center;
    }
    a{
      text-decoration: none;
      font-style: italic;  
    }
       
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">login form</h1>
        <div class="Email">
            <label for="">Email</label>
            <input type="Email" placeholder="xyz@gmail.com">
        </div>
        <div class="Password">
            <label for="">Passworgd</label>
            <input type="Password" placeholder="abcd@1234">
            <p>forget Password ?</p>
            </div>
        <div class="login">
            <input type="button" value="Login" id="Login" >
            <p>Not a member ? <a href="form.html">Sign up</a></p>
        </div>
    </form>
    
</body>
</html>
